<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PeltiFresh | {{ role|capitalize }} Log In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="page-center">
  <main class="login-box">
    <div class="brand brand-large">Pelti<span>Fresh</span></div>

    <form class="login-form" method="post" action="{{ url_for('login_' + role) }}">
      <label class="visually-hidden" for="username">Account name</label>
      <input class="field" type="text" id="username" name="username"
             placeholder="Account Name" autocomplete="username" required>

      <label class="visually-hidden" for="password">Password</label>
      <input class="field" type="password" id="password" name="password"
             placeholder="Password" autocomplete="current-password" required>

      {% if role == 'user' %}
      <div class="login-links">
        <a href="#">Forgot Password?</a>
        <span>Don't have an account? <a class="link-strong" href="{{ url_for('register') }}">Sign up</a></span>
      </div>
      {% endif %}

      <button class="btn btn-green" type="submit">Log In</button>
    </form>
  </main>
</body>
</html>
